<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reinigingsdokter Outreach</title>
<style>
:root{font-family:system-ui,sans-serif;color:#1b2931;background:#f3f7f7}body{margin:0}header{background:#113e46;color:white;padding:1.2rem 2rem}h1{margin:0;font-size:1.4rem}main{max-width:1200px;margin:auto;padding:1.5rem}nav{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.5rem}button{background:#0d7274;color:white;border:0;border-radius:7px;padding:.7rem 1rem;cursor:pointer}button:hover{background:#09585a}nav button{background:#dce9e9;color:#123}nav button.active{background:#0d7274;color:white}.card{background:white;border-radius:12px;padding:1.2rem;margin-bottom:1rem;box-shadow:0 2px 12px #173d4411}input,textarea,select{border:1px solid #adc4c5;border-radius:6px;padding:.6rem;font:inherit;box-sizing:border-box}label{display:grid;gap:.3rem;margin:.6rem 0}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.5rem 1rem}form button{align-self:end}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:.65rem;border-bottom:1px solid #e1eaea;vertical-align:top}small{color:#587078}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:1rem}.metric{font-size:1.7rem;font-weight:700}.scroll{overflow:auto}.error{color:#a42424}.muted{color:#587078}pre{white-space:pre-wrap;max-width:600px}
</style></head><body><header><h1>Reinigingsdokter · Outreach</h1></header><main><nav id="nav"></nav><div id="content"></div></main>
<script>
const pages=['Overview','Leads','Campaigns','Emails','Replies','Interested Leads','Suppression List','Settings','Logs'];let current='Overview';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,method='GET',data){const r=await fetch('/api/'+path,{method,headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined});if(!r.ok)throw Error(await r.text());return r.json()}
function table(rows,cols){return '<div class="scroll"><table><thead><tr>'+cols.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+cols.map(c=>'<td>'+esc(row[c])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function formData(form){return Object.fromEntries(new FormData(form).entries())}
async function render(){document.querySelector('#nav').innerHTML=pages.map(p=>`<button class="${p===current?'active':''}" data-page="${esc(p)}">${esc(p)}</button>`).join('');const el=document.querySelector('#content');el.innerHTML='<div class="card">Laden…</div>';try{
if(current==='Overview'){let d=await api('overview');el.innerHTML='<div class="metrics">'+Object.entries(d).map(([k,v])=>`<div class="card"><small>${esc(k.replaceAll('_',' '))}</small><div class="metric">${esc(v)}</div></div>`).join('')+'</div>'}
if(current==='Leads'){let d=await api('leads');el.innerHTML=`<div class="card"><h2>Lead handmatig toevoegen</h2><form id="lead"><label>Bedrijfsnaam<input name="company_name" required></label><label>Website<input name="website" type="url" required></label><label>Branche<input name="industry" required></label><label>Plaats<input name="city"></label><label>Regio<input name="region"></label><button>Toevoegen</button></form></div><div class="card">${table(d,['id','company_name','website','industry','city','region','blocked'])}</div>`;document.querySelector('#lead').onsubmit=async e=>{e.preventDefault();await api('leads','POST',formData(e.target));render()}}
if(current==='Campaigns'){let d=await api('campaigns');el.innerHTML=`<div class="card"><h2>Campagne maken</h2><form id="campaign"><label>Naam<input name="name" required></label><label>Branches (komma's)<input name="industries" required></label><label>Regio<input name="region"></label><label>Plaats<input name="city"></label><label>Daglimiet<input name="daily_limit" type="number" value="25" min="1"></label><label>Minimumscore<input name="min_score" type="number" value="65" min="0" max="100"></label><label>Dienst (leeg = automatisch)<input name="service_override"></label><label>Follow-ups<input name="max_followups" type="number" value="1" min="0" max="3"></label><button>Maken</button></form></div><div class="card"><h2>Campagnes</h2><div class="scroll"><table><tr><th>Naam</th><th>Branches</th><th>Regio</th><th>Actief</th><th>Actie</th></tr>${d.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.industries.join(', '))}</td><td>${esc(x.region)}</td><td>${x.active?'Ja':'Nee'}</td><td><button data-toggle="${x.id}" data-active="${!x.active}">${x.active?'Pauzeren':'Starten'}</button></td></tr>`).join('')}</table></div></div><div class="card"><h2>Handmatige lead koppelen</h2><form id="attach"><label>Campagne ID<input name="campaign_id" type="number" required></label><label>Lead ID<input name="company_id" type="number" required></label><button>Koppelen</button></form></div>`;document.querySelector('#campaign').onsubmit=async e=>{e.preventDefault();let d=formData(e.target);d.industries=d.industries.split(',').map(x=>x.trim()).filter(Boolean);['daily_limit','min_score','max_followups'].forEach(k=>d[k]=Number(d[k]));await api('campaigns','POST',d);render()};document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{await api(`campaigns/${b.dataset.toggle}/status?active=${b.dataset.active}`,'POST');render()});document.querySelector('#attach').onsubmit=async e=>{e.preventDefault();let d=formData(e.target);await api(`campaigns/${d.campaign_id}/leads/${d.company_id}`,'POST');render()}}
if(current==='Emails'){let d=await api('emails');el.innerHTML='<div class="card"><h2>E-mails</h2>'+table(d,['id','subject','status','sequence','body'])+'</div>'}
if(current==='Replies'){let d=await api('replies');el.innerHTML=`<div class="card"><h2>Reactie registreren</h2><form id="reply"><label>Extern ID<input name="external_id" required></label><label>Afzender<input name="sender" type="email" required></label><label>Onderwerp<input name="subject"></label><label>Classificatie<select name="classification"><option value="">Automatisch</option>${['INTERESTED','NOT_INTERESTED','QUESTION','OUT_OF_OFFICE','UNSUBSCRIBE','BOUNCE','OTHER'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>Tekst<textarea name="body"></textarea></label><button>Verwerken</button></form></div><div class="card">${table(d,['id','classification','snippet','received_at'])}</div>`;document.querySelector('#reply').onsubmit=async e=>{e.preventDefault();await api('replies','POST',formData(e.target));render()}}
if(current==='Interested Leads'){el.innerHTML='<div class="card"><h2>Geïnteresseerde leads</h2>'+table(await api('interested'),['company_name','email','snippet'])+'</div>'}
if(current==='Suppression List'){el.innerHTML=`<div class="card"><h2>Uitsluiting toevoegen</h2><form id="suppress"><label>E-mailadres<input name="email" type="email"></label><label>Domein<input name="domain"></label><button>Toevoegen</button></form></div><div class="card">${table(await api('suppression'),['email','domain','reason'])}</div>`;document.querySelector('#suppress').onsubmit=async e=>{e.preventDefault();let d=formData(e.target);await api('suppression?'+new URLSearchParams(d),'POST');render()}}
if(current==='Settings'){let d=await api('settings');el.innerHTML='<div class="card"><h2>Configuratie</h2>'+table([d.configuration],Object.keys(d.configuration))+'<p class="muted">Verzendinstellingen worden via omgevingsvariabelen beheerd.</p></div><div class="card"><h2>Dienst per branche</h2><form id="service"><label>Branche<input name="industry" required></label><label>Dienst<input name="service" required></label><button>Opslaan</button></form>'+table(d.service_mappings,['industry','service'])+'</div>';document.querySelector('#service').onsubmit=async e=>{e.preventDefault();let d=formData(e.target);await api('settings/services/'+encodeURIComponent(d.industry)+'?service='+encodeURIComponent(d.service),'PUT');render()}}
if(current==='Logs'){el.innerHTML='<div class="card"><h2>Auditlog</h2>'+table(await api('logs'),['created_at','action','entity_type','entity_id','detail'])+'</div>'}
}catch(e){el.innerHTML='<div class="card error">'+esc(e.message)+'</div>'}}
document.querySelector('#nav').onclick=e=>{if(e.target.dataset.page){current=e.target.dataset.page;render()}};render();
</script></body></html>
