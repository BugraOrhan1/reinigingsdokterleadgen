<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reinigingsdokter Outreach</title>
<style>
:root{font-family:system-ui,sans-serif;color:#1b2931;background:#f3f7f7}body{margin:0}header{background:#113e46;color:white;padding:1.2rem 2rem;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:1.4rem}main{max-width:1200px;margin:auto;padding:1.5rem}nav{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.5rem}button{background:#0d7274;color:white;border:0;border-radius:7px;padding:.7rem 1rem;cursor:pointer;font:inherit}button:hover{background:#09585a}nav button{background:#dce9e9;color:#123}nav button.active{background:#0d7274;color:white}.card{background:white;border-radius:12px;padding:1.2rem;margin-bottom:1rem;box-shadow:0 2px 12px #173d4411}input,textarea,select{border:1px solid #adc4c5;border-radius:6px;padding:.6rem;font:inherit;box-sizing:border-box}label{display:grid;gap:.3rem;margin:.6rem 0}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.5rem 1rem}form button{align-self:end}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:.65rem;border-bottom:1px solid #e1eaea;vertical-align:top}small{color:#587078}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:1rem}.metric{font-size:1.7rem;font-weight:700}.scroll{overflow:auto}.error{color:#a42424}.muted{color:#587078}pre{white-space:pre-wrap;max-width:640px}.pill{display:inline-block;padding:.15rem .5rem;border-radius:999px;font-size:.75rem;background:#e1ecea;color:#113e46}.pill.good{background:#d2ecdd;color:#176338}.pill.warn{background:#fbe6d5;color:#8a4a12}.pill.bad{background:#f8d7d7;color:#9a2323}.logout{background:#2d3f45}
</style></head><body>
<header><h1>Reinigingsdokter · Outreach</h1><form method="post" action="/logout"><button class="logout" type="submit">Uitloggen</button></form></header>
<main><nav id="nav"></nav><div id="content"></div></main>
<script>
const pages=['Overview','Leads','Campaigns','Emails','Replies','Interested Leads','Suppression List','Settings','Logs'];let current='Overview';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,method='GET',data){const opts={method,headers:{}};if(data!==undefined){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(data);}const r=await fetch('/api/'+path,opts);if(!r.ok)throw Error(await r.text());return r.json();}
function table(rows,cols){return '<div class="scroll"><table><thead><tr>'+cols.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+cols.map(c=>'<td>'+esc(row[c])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function formData(form){return Object.fromEntries(new FormData(form).entries())}
function statePill(s){return {new:'warn',qualified:'good',rejected:'muted',sent:'good',replied:'warn',interested:'good',not_interested:'muted',unsubscribed:'bad',bounced:'bad',blocked:'bad'}[s]||'muted'}
async function render(){
  document.querySelector('#nav').innerHTML=pages.map(p=>`<button class="${p===current?'active':''}" data-page="${esc(p)}">${esc(p)}</button>`).join('');
  const el=document.querySelector('#content');el.innerHTML='<div class="card">Laden…</div>';
  try{
  if(current==='Overview'){let d=await api('overview');const meta=[['dry_run','dry run'],['live_send_enabled','live verzenden'],['automation','automatisering']].filter(([k])=>d[k]!==undefined).map(([k,l])=>`<div class="card"><small>${l}</small><div class="metric">${d[k]?'ja':'nee'}</div></div>`).join('');el.innerHTML='<div class="metrics">'+Object.entries(d).filter(([k])=>typeof d[k]==='number').map(([k,v])=>`<div class="card"><small>${esc(k.replaceAll('_',' '))}</small><div class="metric">${esc(v)}</div></div>`).join('')+'</div><div class="metrics">'+meta+'</div>'}
  if(current==='Leads'){
    let d=await api('leads');
    el.innerHTML='<div class="card"><h2>Lead handmatig toevoegen</h2><form id="lead"><label>Bedrijfsnaam<input name="company_name" required></label><label>Website<input name="website" type="url" required></label><label>Branche<input name="industry" required placeholder="restaurant, kantoor…"></label><label>Plaats<input name="city"></label><label>Regio<input name="region"></label><button>Toevoegen</button></form></div>'+
    '<div class="card"><h2>Gevonden leads</h2>'+table(d,['id','company_name','website','industry','city','region','source','analyzed','blocked'])+'</div>';
    document.querySelector('#lead').onsubmit=async e=>{e.preventDefault();await api('leads','POST',formData(e.target));render()};
  }
  if(current==='Campaigns'){
    let d=await api('campaigns');
    el.innerHTML='<div class="card"><h2>Campagne maken</h2><form id="campaign"><label>Naam<input name="name" required placeholder="Restaurants Zuid-Holland"></label><label>Branches (komma\'s)<input name="industries" required placeholder="restaurant"></label><label>Regio<input name="region" placeholder="Zuid-Holland"></label><label>Plaats<input name="city" placeholder="Rotterdam"></label><label>Zoekradius (km)<input name="radius_km" type="number" value="0" min="0"></label><label>Daglimiet<input name="daily_limit" type="number" value="25" min="1"></label><label>Minimumscore<input name="min_score" type="number" value="70" min="0" max="100"></label><label>Dienst (leeg = auto)<input name="service_override"></label><label>Follow-ups<input name="max_followups" type="number" value="1" min="0"></label><button>Maken</button></form></div>'+
    '<div class="card"><h2>Campagnes</h2><div class="scroll"><table><tr><th>Naam</th><th>Branches</th><th>Regio</th><th>Radius</th><th>Actief</th><th>Leads</th><th>Actie</th></tr>'+d.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc((x.industries||[]).join(', '))}</td><td>${esc(x.region)}${x.city?' · '+esc(x.city):''}</td><td>${x.radius_km?x.radius_km+' km':'—'}</td><td>${x.active?'Ja':'Nee'}</td><td>${x.lead_count}</td><td><button data-toggle="${x.id}" data-active="${!x.active}">${x.active?'Pauzeren':'Starten'}</button> <button data-del="${x.id}" style="background:#9a2323">Verwijderen</button></td></tr>`).join('')+'</table></div></div>'+
    '<div class="card"><h2>Handmatige lead koppelen</h2><form id="attach"><label>Campagne ID<input name="campaign_id" type="number" required></label><label>Lead ID<input name="company_id" type="number" required></label><button>Koppelen</button></form></div>';
    document.querySelector('#campaign').onsubmit=async e=>{e.preventDefault();let d=formData(e.target);d.industries=d.industries.split(',').map(x=>x.trim()).filter(Boolean);['daily_limit','min_score','max_followups','radius_km'].forEach(k=>d[k]=Number(d[k]));await api('campaigns','POST',d);render()};
    document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{await api(`campaigns/${b.dataset.toggle}/status?active=${b.dataset.active}`,'POST');render()});
    document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('Campagne verwijderen?')){await api(`campaigns/${b.dataset.del}`,'DELETE');render()}});
    document.querySelector('#attach').onsubmit=async e=>{e.preventDefault();let d=formData(e.target);await api(`campaigns/${d.campaign_id}/leads/${d.company_id}`,'POST');render()};
  }
  if(current==='Emails'){let d=await api('emails');el.innerHTML='<div class="card"><h2>E-mails</h2>'+table(d,['id','company_name','subject','status','outcome','sequence','sent_at','error'])+'</div>'}
  if(current==='Replies'){
    let d=await api('replies');
    el.innerHTML='<div class="card"><h2>Reactie registreren</h2><form id="reply"><label>Extern ID<input name="external_id" required></label><label>Afzender<input name="sender" type="email" required></label><label>Onderwerp<input name="subject"></label><label>Classificatie<select name="classification"><option value="">Automatisch</option>'+['INTERESTED','NOT_INTERESTED','QUESTION','OUT_OF_OFFICE','UNSUBSCRIBE','BOUNCE','OTHER'].map(x=>`<option>${x}</option>`).join('')+'</select></label><label>Doeladres (bij bounce)<input name="target_email" type="email"></label><label>Tekst<textarea name="body"></textarea></label><button>Verwerken</button></form></div>'+
    '<div class="card">'+table(d,['id','classification','snippet','received_at'])+'</div>';
    document.querySelector('#reply').onsubmit=async e=>{e.preventDefault();await api('replies','POST',formData(e.target));render()};
  }
  if(current==='Interested Leads'){el.innerHTML='<div class="card"><h2>Geïnteresseerde leads</h2>'+table(await api('interested'),['company_name','email','snippet'])+'</div>'}
  if(current==='Suppression List'){
    let d=await api('suppression');
    el.innerHTML='<div class="card"><h2>Uitsluiting toevoegen</h2><form id="suppress"><label>E-mailadres<input name="email" type="email"></label><label>Domein<input name="domain"></label><button>Toevoegen</button></form></div><div class="card"><h2>Uitgesloten adressen / domeinen</h2>'+table(d,['id','email','domain','reason','created_at'])+'</div>';
    document.querySelector('#suppress').onsubmit=async e=>{e.preventDefault();let d=formData(e.target);await api('suppression?'+new URLSearchParams(d),'POST');render()};
  }
  if(current==='Settings'){
    let d=await api('settings');
    el.innerHTML='<div class="card"><h2>Configuratie</h2>'+table([d.configuration],Object.keys(d.configuration))+'<p class="muted">Verzendinstellingen worden via omgevingsvariabelen beheerd; kijk op het tabblad Campagnes om een campagne te starten.</p></div>'+
    '<div class="card"><h2>Dienst per branche</h2><form id="service"><label>Branche<input name="industry" required placeholder="restaurant"></label><label>Dienst<input name="service" required placeholder="vloer- en periodieke reiniging"></label><button>Opslaan</button></form>'+table(d.service_mappings,['industry','service'])+'</div>';
    document.querySelector('#service').onsubmit=async e=>{e.preventDefault();let d=formData(e.target);await api('settings/services/'+encodeURIComponent(d.industry)+'?service='+encodeURIComponent(d.service),'PUT');render()};
  }
  if(current==='Logs'){el.innerHTML='<div class="card"><h2>Auditlog</h2>'+table(await api('logs'),['created_at','action','entity_type','entity_id','detail'])+'</div>'}
  }catch(e){el.innerHTML='<div class="card error">'+esc(e.message)+'</div>'}
}
document.querySelector('#nav').onclick=e=>{if(e.target.dataset.page){current=e.target.dataset.page;render()}};
render();
</script></body></html>
